# The API alone, as compose.distributed.yaml runs it: searches over what the
# writer stored, and the interface. It needs no topics.

roles = ["api"]

[store]
url = "http://clickhouse:8123"
database = "goliath"
user = "goliath"
password_file = "/run/secrets/clickhouse_password"

[api]
listen = "0.0.0.0:8080"
token_file = "/run/secrets/api_token"
ui = "/usr/share/goliath/ui"
# Written to the log at start, so that the address is one click away in
# Docker Desktop; compose publishes the port on 127.0.0.1.
url = "http://127.0.0.1:8080"

# Reachable on the compose network, for a Prometheus beside the roles.
[metrics]
listen = "0.0.0.0:9464"
