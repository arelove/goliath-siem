# Every role in one container, as compose.yaml runs it. Paths are inside the
# container: /var/lib/goliath is a volume, and the inbox is bound to ./inbox
# on the host.

roles = ["collector", "normalizer", "detector", "writer", "api"]
data = "/var/lib/goliath/data"

[[sources]]
definition = "sysmon"
inbox = "/var/lib/goliath/inbox/sysmon"

# What an Android phone exported with PCAPdroid; see docs/phone.md.
[[sources]]
definition = "pcapdroid"
inbox = "/var/lib/goliath/inbox/pcapdroid"

# Feeds of abuse.ch, fetched when the platform starts and kept current: the
# one thing here that reaches out of the machine. Nothing of an event is
# sent: the feeds are looked up locally. Without a way out the platform
# runs the same, and matches nothing until a feed was fetched.
[detector]

[[detector.feeds]]
definition = "threatfox"

[[detector.feeds]]
definition = "urlhaus"

[[detector.feeds]]
definition = "feodo-tracker"

[store]
url = "http://clickhouse:8123"
database = "goliath"
user = "goliath"
# Mounted by compose from the CLICKHOUSE_PASSWORD in .env.
password_file = "/run/secrets/clickhouse_password"
retention_days = 30

[writer]
max_rows = 50000
max_delay_ms = 1000

# Reachable from outside the container, so it takes a token; compose
# publishes it on 127.0.0.1:8080 only.
[api]
listen = "0.0.0.0:8080"
token_file = "/run/secrets/api_token"
ui = "/usr/share/goliath/ui"
# Written to the log at start, so that the address is one click away in
# Docker Desktop; compose publishes the port on 127.0.0.1.
url = "http://127.0.0.1:8080"

# Published on 127.0.0.1:9464 by compose.
[metrics]
listen = "0.0.0.0:9464"
