# Every role in one container, as compose.yaml runs it. Paths are inside the
# container: /var/lib/goliath is a volume, and the inbox is bound to ./inbox
# on the host.

roles = ["collector", "normalizer", "writer"]
data = "/var/lib/goliath/data"

[[sources]]
definition = "sysmon"
inbox = "/var/lib/goliath/inbox/sysmon"

[store]
url = "http://clickhouse:8123"
database = "goliath"
user = "goliath"
# Mounted by compose from the CLICKHOUSE_PASSWORD in .env.
password_file = "/run/secrets/clickhouse_password"
retention_days = 30

[writer]
max_rows = 50000
max_delay_ms = 1000
