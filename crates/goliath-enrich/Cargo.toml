[package]
name = "goliath-enrich"
description = "Context for the Goliath security platform: networks, assets, identities, and groups from a site's own exports, found by any identifier at the time of an event, and written as OCSF enrichments"
keywords = ["enrichment", "asset", "identity", "siem", "security"]
categories = ["data-structures"]
readme = "README.md"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published until the detector has used it.
publish = false

[dependencies]
goliath-intel = { path = "../goliath-intel", version = "0.1.0" }
goliath-sigma = { path = "../goliath-sigma", version = "0.1.2" }
jiff = { version = "0.2", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
