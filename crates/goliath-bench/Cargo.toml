[package]
name = "goliath-bench"
description = "Workloads and benchmarks for Goliath; not published"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Builds the Callgrind benchmarks. They run the benchmark binary under
# Valgrind, which only exists on Linux, so they stay out of `cargo test
# --all-targets` everywhere unless asked for.
callgrind = []
# Builds the search benchmark, which stores millions of events in a
# ClickHouse server and times searches over them.
search = ["dep:clickhouse", "dep:goliath-search", "dep:goliath-store", "dep:tokio"]
rig = ["dep:goliath", "dep:goliath-pipe", "goliath-pipe/kafka", "dep:sysinfo", "dep:clickhouse", "dep:tokio"]
# Builds the detector's benchmark, which fills a topic on disk and runs the
# `goliath` binary on it. No server is needed.
intel = ["dep:goliath-gen", "dep:goliath-pipe", "dep:sysinfo", "dep:tokio"]

[dependencies]
goliath = { path = "../goliath", features = ["kafka"], optional = true }
goliath-gen = { path = "../goliath-gen", optional = true }
goliath-pipe = { path = "../goliath-pipe", optional = true }
sysinfo = { version = "0.38", default-features = false, features = ["system"], optional = true }
clickhouse = { version = "0.15.2", default-features = false, features = ["lz4"], optional = true }
goliath-match = { path = "../goliath-match" }
goliath-normalize = { path = "../goliath-normalize" }
goliath-rule = { path = "../goliath-rule" }
goliath-search = { path = "../goliath-search", optional = true }
goliath-sigma = { path = "../goliath-sigma" }
goliath-store = { path = "../goliath-store", optional = true }
jiff = { version = "0.2", default-features = false, features = ["std"] }
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "time", "signal"], optional = true }

[dev-dependencies]
gungraun = "0.20.0"

[[bench]]
name = "engine"
harness = false
required-features = ["callgrind"]

[[bin]]
name = "search"
required-features = ["search"]

[[bin]]
name = "rig"
required-features = ["rig"]

[[bin]]
name = "intel"
required-features = ["intel"]

[lints]
workspace = true
