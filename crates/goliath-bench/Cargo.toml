[package]
name = "goliath-bench"
description = "Workloads and benchmarks for Goliath; not published"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Builds the Callgrind benchmarks. They run the benchmark binary under
# Valgrind, which only exists on Linux, so they stay out of `cargo test
# --all-targets` everywhere unless asked for.
callgrind = []
# Builds the search benchmark, which stores millions of events in a
# ClickHouse server and times searches over them.
search = ["dep:clickhouse", "dep:goliath-normalize", "dep:goliath-search", "dep:goliath-store", "dep:tokio"]

[dependencies]
clickhouse = { version = "0.15.2", default-features = false, features = ["lz4"], optional = true }
goliath-match = { path = "../goliath-match" }
goliath-normalize = { path = "../goliath-normalize", optional = true }
goliath-rule = { path = "../goliath-rule" }
goliath-search = { path = "../goliath-search", optional = true }
goliath-sigma = { path = "../goliath-sigma" }
goliath-store = { path = "../goliath-store", optional = true }
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"], optional = true }

[dev-dependencies]
goliath-normalize = { path = "../goliath-normalize" }
gungraun = "0.19.4"

[[bench]]
name = "engine"
harness = false
required-features = ["callgrind"]

[[bin]]
name = "search"
required-features = ["search"]

[lints]
workspace = true
