[package]
name = "goliath-intel"
description = "Threat intelligence for the Goliath security platform: indicators in canonical form, the provenance of every feed that asserts one, allowlists that take precedence, and lookup"
keywords = ["threat-intelligence", "indicator", "ioc", "siem", "security"]
categories = ["data-structures"]
readme = "README.md"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published until the detector has used it.
publish = false

[dependencies]
goliath-sigma = { path = "../goliath-sigma", version = "0.1.2" }
jiff = { version = "0.2", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Behind `rocksdb`, since it is a C++ library built from source, which needs
# a C++ compiler and libclang. See docs/adr/0020-state-beyond-events.md.
rocksdb = { version = "0.25", default-features = false, features = ["bindgen-runtime", "lz4"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# The store on disk, for sets too large for memory.
rocksdb = ["dep:rocksdb"]

[lints]
workspace = true

[[example]]
name = "intel_lookup"
required-features = ["rocksdb"]
