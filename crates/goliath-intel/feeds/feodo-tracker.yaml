# abuse.ch Feodo Tracker: addresses of botnet command and control servers.
# A row is the server's address and port, when it was first seen, and the
# day it was last online.

name: feodo-tracker
description: Botnet command and control servers tracked by abuse.ch
url: https://feodotracker.abuse.ch/downloads/ipblocklist.csv
licence: CC0-1.0
confidence: 90
refresh_minutes: 60
# Addresses are reassigned: one not seen online for a month no longer holds.
valid_days: 30
format: csv
csv:
  value: dst_ip
  kind: ip
  first_seen: first_seen_utc
  last_seen: last_online
