# Domains of dynamic DNS providers, from the reference lists of
# mthcht/awesome-lists. A row is a domain under which anyone can register a
# name, when it was listed, and the provider.
#
# A name under one of them is not an attack: home users and small sites
# have them. It says that the name costs nothing and is tied to nobody,
# which is worth knowing of the host a finding is about. So this list is
# context: it is added to findings and never raises one.
#
# The list is pinned to a commit: what an entry is reported with is that
# commit, and taking a newer list is a change of `revision`.

name: dynamic-dns
