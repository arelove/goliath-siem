# Sigma field names for Windows log sources, resolved to OCSF 1.5.0 paths.
#
# Where OCSF has no attribute with the same meaning, the field maps to
# `unmapped.<name>` explicitly, and the normalizer keeps the original there.
# Never approximate one attribute with another that merely looks similar: a
# rule matched against the wrong attribute is worse than a rule that refuses
# to load. See docs/adr/0012-sigma-field-mapping.md.
#
# Parent process attributes are listed under both `process.parent_process` and
# `actor.process`, and the image path under both `file.path` and `path`,
# because OCSF allows either and producers differ.

name: sigma-windows
version: 5

mappings:
  - logsource: { category: process_creation, product: windows }
    # Process Activity, Launch, on Windows.
    class: { class_uid: 1007, activity_id: 1, device.os.type_id: 100 }
    fields:
      Image: [process.file.path, process.path]
      # The PE OriginalFilename resource. `file.internal_name` is the
      # InternalName resource, a different field.
      OriginalFileName: unmapped.OriginalFileName
      CommandLine: process.cmd_line
      CurrentDirectory: process.working_directory
      IntegrityLevel: process.integrity
      User: process.user.name
      LogonId: process.session.uid
      LogonGuid: unmapped.LogonGuid
      TerminalSessionId: unmapped.TerminalSessionId
      ProcessId: process.pid
      ProcessGuid: process.uid
      # Sysmon writes one string, such as `SHA256=...,IMPHASH=...`, and rules
      # match its text. OCSF splits it into `file.hashes` objects.
      Hashes: unmapped.Hashes
      Product: process.file.product.name
      Company: process.file.company_name
      Description: process.file.desc
      FileVersion: process.file.version
      ParentImage:
        - process.parent_process.file.path
        - process.parent_process.path
        - actor.process.file.path
        - actor.process.path
      ParentCommandLine: [process.parent_process.cmd_line, actor.process.cmd_line]
      ParentProcessId: [process.parent_process.pid, actor.process.pid]
      ParentProcessGuid: [process.parent_process.uid, actor.process.uid]
      ParentUser: [process.parent_process.user.name, actor.process.user.name]
      # Not in the Sigma taxonomy, but used by SigmaHQ rules.
      GrandParentImage:
        - process.parent_process.parent_process.file.path
        - process.parent_process.parent_process.path
        - actor.process.parent_process.file.path
        - actor.process.parent_process.path

  # In the entries below, `actor.process` is the process that performed the
  # activity, as OCSF defines it for system events.

  - logsource: { category: file_event, product: windows }
    # File System Activity, Create, on Windows.
    class: { class_uid: 1001, activity_id: 1, device.os.type_id: 100 }
    fields:
      TargetFilename: file.path
      Image: [actor.process.file.path, actor.process.path]
      CommandLine: actor.process.cmd_line
      ParentImage:
        - actor.process.parent_process.file.path
        - actor.process.parent_process.path
      ParentCommandLine: actor.process.parent_process.cmd_line
      ProcessId: actor.process.pid
      ProcessGuid: actor.process.uid
      User: [actor.user.name, actor.process.user.name]
      IntegrityLevel: actor.process.integrity
      # Sysmon writes a formatted date; OCSF times are epoch milliseconds.
      CreationUtcTime: unmapped.CreationUtcTime

  - logsource: { category: image_load, product: windows }
    # Module Activity, Load, on Windows. The file attributes describe the
    # loaded module, not the loading process.
    class: { class_uid: 1005, activity_id: 1, device.os.type_id: 100 }
    fields:
      ImageLoaded: module.file.path
      Image: [actor.process.file.path, actor.process.path]
      CommandLine: actor.process.cmd_line
      ProcessId: actor.process.pid
      ProcessGuid: actor.process.uid
      User: [actor.user.name, actor.process.user.name]
      Product: module.file.product.name
      Company: module.file.company_name
      Description: module.file.desc
      FileVersion: module.file.version
      OriginalFileName: unmapped.OriginalFileName
      Hashes: unmapped.Hashes
      # Sysmon's signature fields are strings such as `true` and `Valid`.
      # OCSF describes signatures with a structured object and enumerations,
      # so a rule comparing the strings needs them as Sysmon wrote them.
      Signed: unmapped.Signed
      Signature: unmapped.Signature
      SignatureStatus: unmapped.SignatureStatus

  - logsource: { category: network_connection, product: windows }
    # Network Activity on Windows. No activity is required: producers record
    # a Sysmon connection as Open or as Traffic.
    class: { class_uid: 4001, device.os.type_id: 100 }
    fields:
      Image: [actor.process.file.path, actor.process.path]
      CommandLine: actor.process.cmd_line
      ParentImage:
        - actor.process.parent_process.file.path
        - actor.process.parent_process.path
      ProcessId: actor.process.pid
      ProcessGuid: actor.process.uid
      User: [actor.user.name, actor.process.user.name]
      SourceIp: src_endpoint.ip
      SourceHostname: src_endpoint.hostname
      SourcePort: src_endpoint.port
      DestinationIp: dst_endpoint.ip
      DestinationHostname: dst_endpoint.hostname
      DestinationPort: dst_endpoint.port
      Protocol: connection_info.protocol_name
      # `true` or `false` in Sysmon; OCSF expresses direction as an
      # enumeration, which a path alone cannot translate to.
      Initiated: unmapped.Initiated
      SourceIsIpv6: unmapped.SourceIsIpv6
      DestinationIsIpv6: unmapped.DestinationIsIpv6

  - logsource: { category: registry_set, product: windows }
    # Registry Value Activity, Set, from the OCSF Windows extension.
    class: { class_uid: 201002, activity_id: 2, device.os.type_id: 100 }
    fields:
      TargetObject: reg_value.path
      # Sysmon renders the value as text, such as `DWORD (0x00000001)`, and
      # rules match that text. OCSF `reg_value.data` holds the value itself.
      Details: unmapped.Details
      EventType: unmapped.EventType
      Image: [actor.process.file.path, actor.process.path]
      ProcessId: actor.process.pid
      ProcessGuid: actor.process.uid
      User: [actor.user.name, actor.process.user.name]

  - logsource: { product: windows, service: security }
    # The Security event log. One log source covers events of several OCSF
    # classes, so the class condition is the log itself, and rules select
    # events by `EventID` as they do on Windows. Paths follow the
    # `windows-security` source definition.
    #
    # A Windows field lands on different attributes in different events:
    # `TargetUserName` is the account in a logon and the group in a group
    # change. Each field therefore lists every attribute it is written to,
    # and a rule's `EventID` picks which one applies. Each also lists its
    # place under `unmapped`, where the definition keeps it in events that
    # do not map it, and where a value Windows writes as `-` stays, so that
    # filters such as `IpAddress: '-'` keep working.
    #
    # Fields of events the definition does not read, such as the server of
    # 4648, are not listed: rules that need them fail to load, which shows
    # the gap, instead of loading and never firing.
    class: { metadata.log_name: Security, device.os.type_id: 100 }
    fields:
      EventID: metadata.event_code
      Channel: metadata.log_name
      Computer: device.hostname
      SubjectUserSid: [actor.user.uid, process.user.uid, unmapped.SubjectUserSid]
      SubjectUserName: [actor.user.name, process.user.name, unmapped.SubjectUserName]
      SubjectDomainName: [actor.user.domain, process.user.domain, unmapped.SubjectDomainName]
      SubjectLogonId: [process.session.uid, unmapped.SubjectLogonId]
      TargetUserSid: [user.uid, unmapped.TargetUserSid]
      TargetSid: [user.uid, group.uid, unmapped.TargetSid]
      TargetUserName: [user.name, group.name, unmapped.TargetUserName]
      TargetDomainName: [user.domain, group.domain, unmapped.TargetDomainName]
      TargetLogonId: [session.uid, unmapped.TargetLogonId]
      # Windows numbers logon types as OCSF does.
      LogonType: [logon_type_id, unmapped.LogonType]
      LogonProcessName: [logon_process.name, unmapped.LogonProcessName]
      AuthenticationPackageName: [auth_protocol, unmapped.AuthenticationPackageName]
      WorkstationName: [src_endpoint.hostname, unmapped.WorkstationName]
      TargetServerName: [dst_endpoint.hostname, unmapped.TargetServerName]
      Workstation: [src_endpoint.hostname, unmapped.Workstation]
      PackageName: [auth_protocol, unmapped.PackageName]
      IpAddress: [src_endpoint.ip, unmapped.IpAddress]
      IpPort: [src_endpoint.port, unmapped.IpPort]
      ProcessName: [actor.process.file.path, unmapped.ProcessName]
      ProcessId: [actor.process.pid, process.parent_process.pid, unmapped.ProcessId]
      NewProcessName: process.file.path
      NewProcessId: process.pid
      CommandLine: process.cmd_line
      ParentProcessName: process.parent_process.file.path
      Status: [status_code, unmapped.Status]
      SubStatus: [status_detail, unmapped.SubStatus]
      ServiceName: [service.name, win_service.name, unmapped.ServiceName]
      ServiceSid: [service.uid, unmapped.ServiceSid]
      MemberName: [user.name, unmapped.MemberName]
      MemberSid: [user.uid, unmapped.MemberSid]
      TaskName: [job.name, unmapped.TaskName]
      ServiceFileName: win_service.cmd_line
      ServiceAccount: [win_service.service_start_name, unmapped.ServiceAccount]
      ObjectName: [win_resource.name, unmapped.ObjectName]
      ObjectType: [win_resource.type, unmapped.ObjectType]
      HandleId: [win_resource.uid, unmapped.HandleId]
      ShareName: [share, unmapped.ShareName]
      RelativeTargetName: [file.path, unmapped.RelativeTargetName]
      ObjectDN: [entity.name, unmapped.ObjectDN]
      ObjectGUID: [entity.uid, unmapped.ObjectGUID]
      ObjectClass: [entity.type, unmapped.ObjectClass]
      # Kept as Windows writes them in every event that has them.
      FailureReason: unmapped.FailureReason
      TicketEncryptionType: unmapped.TicketEncryptionType
      TicketOptions: unmapped.TicketOptions
      PreAuthType: unmapped.PreAuthType
      ElevatedToken: unmapped.ElevatedToken
      ImpersonationLevel: unmapped.ImpersonationLevel
      RestrictedAdminMode: unmapped.RestrictedAdminMode
      VirtualAccount: unmapped.VirtualAccount
      KeyLength: unmapped.KeyLength
      LmPackageName: unmapped.LmPackageName
      LogonGuid: unmapped.LogonGuid
      TransmittedServices: unmapped.TransmittedServices
      TokenElevationType: unmapped.TokenElevationType
      MandatoryLabel: unmapped.MandatoryLabel
      PrivilegeList: [policy.name, unmapped.PrivilegeList]
      SamAccountName: unmapped.SamAccountName
      DisplayName: unmapped.DisplayName
      UserPrincipalName: unmapped.UserPrincipalName
      UserAccountControl: unmapped.UserAccountControl
      TaskContent: unmapped.TaskContent
      TaskContentNew: unmapped.TaskContentNew
      ServiceType: unmapped.ServiceType
      ServiceStartType: unmapped.ServiceStartType
      ObjectServer: unmapped.ObjectServer
      AccessMask: unmapped.AccessMask
      AccessList: unmapped.AccessList
      AccessReason: unmapped.AccessReason
      TransactionId: unmapped.TransactionId
      ResourceAttributes: unmapped.ResourceAttributes
      RestrictedSidCount: unmapped.RestrictedSidCount
      ShareLocalPath: unmapped.ShareLocalPath
      DSName: unmapped.DSName
      DSType: unmapped.DSType
      AttributeLDAPDisplayName: unmapped.AttributeLDAPDisplayName
      AttributeSyntaxOID: unmapped.AttributeSyntaxOID
      AttributeValue: unmapped.AttributeValue
      OperationType: unmapped.OperationType
      OpCorrelationID: unmapped.OpCorrelationID
      AppCorrelationID: unmapped.AppCorrelationID
      DnsHostName: unmapped.DnsHostName
      ServicePrincipalNames: unmapped.ServicePrincipalNames
      Properties: unmapped.Properties
      AdditionalInfo: unmapped.AdditionalInfo
      AdditionalInfo2: unmapped.AdditionalInfo2
      ObjectValueName: unmapped.ObjectValueName
      OldValue: unmapped.OldValue
      NewValue: unmapped.NewValue
      OldValueType: unmapped.OldValueType
      NewValueType: unmapped.NewValueType
      AllowedToDelegateTo: unmapped.AllowedToDelegateTo
      OldUacValue: unmapped.OldUacValue
      NewUacValue: unmapped.NewUacValue
      PasswordLastSet: unmapped.PasswordLastSet
      AccountExpires: unmapped.AccountExpires
      PrimaryGroupId: unmapped.PrimaryGroupId
      HomeDirectory: unmapped.HomeDirectory
      HomePath: unmapped.HomePath
      ScriptPath: unmapped.ScriptPath
      ProfilePath: unmapped.ProfilePath
      UserWorkstations: unmapped.UserWorkstations
      UserParameters: unmapped.UserParameters
      SidHistory: unmapped.SidHistory
      LogonHours: unmapped.LogonHours
      ComputerAccountChange: unmapped.ComputerAccountChange
      TargetInfo: unmapped.TargetInfo
      TargetLogonGuid: unmapped.TargetLogonGuid
