[package]
name = "goliath"
description = "The Goliath security platform: every role in one binary"
readme = "README.md"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
clap = { version = "4.6", features = ["derive"] }
goliath-normalize = { path = "../goliath-normalize", version = "0.2.3" }
goliath-ocsf = { path = "../goliath-ocsf", version = "0.1.2" }
goliath-pipe = { path = "../goliath-pipe", version = "0.1.0" }
goliath-search = { path = "../goliath-search", version = "0.1.0" }
goliath-store = { path = "../goliath-store", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
subtle = "2.6"
thiserror.workspace = true
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# Topics in Kafka or Redpanda, for roles in separate processes. Builds
# librdkafka, which needs a C toolchain.
kafka = ["goliath-pipe/kafka"]

[dev-dependencies]
clickhouse = { version = "0.15.2", default-features = false, features = ["lz4"] }
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["io-util"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
