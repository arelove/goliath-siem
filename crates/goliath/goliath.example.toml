# Every role in one process: files dropped into the inbox are normalized and
# stored in ClickHouse. Relative paths are taken from this file's directory.

roles = ["collector", "normalizer", "writer"]

# Durable topics between the roles, and each role's position in them.
data = "data"

[[sources]]
# A built-in definition, or the path of a YAML source definition.
definition = "sysmon"
# Drop `evtx_dump -o json` output here. Write a file under a name ending in
# `.tmp` and rename it when complete; collected files move to `done/`.
inbox = "inbox/sysmon"

[store]
url = "http://localhost:8123"
database = "goliath"
user = "goliath"
# The password is read from this environment variable, never from the file.
password_env = "GOLIATH_CLICKHOUSE_PASSWORD"
# Counted from when a record was received, not from the time it claims.
retention_days = 30

[writer]
max_rows = 50000
max_delay_ms = 1000
# Threads that decode outcomes into rows at once; every core if left out.
# threads = 8

# Threads that normalize a batch at once; every core if left out.
# [normalizer]
# threads = 8

# The `api` role, if listed in `roles`: searches over HTTP. On loopback by
# default; any other address needs a token of at least 32 bytes, such as one
# from `openssl rand -hex 32`, in a file.
#
# [api]
# listen = "127.0.0.1:8080"
# token_file = "/run/secrets/api_token"
# ui = "ui/dist"                   # the built interface, served at /
# max_span_days = 31               # the longest time range a search may cover

# Metrics for Prometheus, at /metrics: records collected, normalized, and
# stored, dead letters by source and stage, and the time to write a batch and
# to answer a search. No token: it holds counts, never events, so listen only
# where the monitoring system reaches.
#
# [metrics]
# listen = "127.0.0.1:9464"

# Keep topics in Kafka or Redpanda instead of `data`, so that roles can run in
# separate processes; each then lists only its own roles. Needs a binary built
# with `--features kafka`.
#
# [kafka]
# brokers = "localhost:9092"
# replication = 3                  # replicas of each topic created
# password_file = "/run/secrets/kafka_password"
# [kafka.client]                   # librdkafka settings, never the password
# "security.protocol" = "SASL_SSL"
# "sasl.mechanism" = "SCRAM-SHA-512"
# "sasl.username" = "goliath"

# The `receiver` role, if listed in `roles`: takes records sent over HTTP,
# `POST /ingest/<source>` with the source's own bearer token, into the
# source's raw topic, answering only once the pipe has them. On loopback by
# default; any other address needs a certificate and key, PEM files, and is
# then served over HTTPS only. See docs/adr/0018-collection.md.
#
# The same listener takes OpenTelemetry logs, `POST /v1/logs` as OTLP/HTTP
# sends them, protobuf or JSON, for the source whose token the request
# carries: each log record becomes a JSON line with its time, severity,
# body, attributes, and resource, for a definition with `lines` framing and
# `json` decoding.
#
# [receiver]
# listen = "0.0.0.0:8514"
# tls = { certificate = "/etc/goliath/receiver.crt", key = "/etc/goliath/receiver.key" }
#
# [[sources]]
# definition = "falco"
# http = { token_file = "/run/secrets/falco_token" }
#
# A source may take syslog over TCP instead, or as well, on a port of its
# own, framed by length or by line as RFC 6587 describes. Its definition
# reads it with `framing: syslog`. A port beyond loopback needs TLS.
#
# [[sources]]
# definition = "/etc/goliath/sources/linux.yaml"
# syslog = { listen = "0.0.0.0:6514", tls = { certificate = "/etc/goliath/receiver.crt", key = "/etc/goliath/receiver.key" } }
