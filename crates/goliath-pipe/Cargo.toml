[package]
name = "goliath-pipe"
description = "Transport between the roles of the Goliath security platform: ordered topics, consumer groups, at-least-once delivery"
keywords = ["siem", "security", "queue", "pipeline"]
categories = ["asynchronous"]
readme = "README.md"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published until the disk log and Kafka implementations share the contract.
publish = false

[dependencies]
crc32c = "0.6"
thiserror.workspace = true
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }

# Behind `kafka`, since only the distributed topology needs it: librdkafka, a
# C library, built from source and linked statically. On Linux and macOS it
# builds with its own configure script, its primary build; its CMake build
# there includes curl headers even with curl disabled. Windows has no
# configure, so it uses CMake.
[target.'cfg(not(windows))'.dependencies]
rdkafka = { version = "0.39", default-features = false, features = ["libz-static", "tokio"], optional = true }

[target.'cfg(windows)'.dependencies]
rdkafka = { version = "0.39", default-features = false, features = ["cmake-build", "libz-static", "tokio"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[features]
# The Kafka or Redpanda implementation.
kafka = ["dep:rdkafka"]

[lints]
workspace = true
