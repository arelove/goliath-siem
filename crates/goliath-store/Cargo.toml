[package]
name = "goliath-store"
description = "Storage of normalized OCSF events in ClickHouse, with versioned migrations"
keywords = ["ocsf", "siem", "security", "clickhouse"]
categories = ["database"]
readme = "README.md"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published until the storage layout has met a second source and the
# distributed topology.
publish = false

[dependencies]
blake3 = "1"
clickhouse = { version = "0.15.2", default-features = false, features = ["lz4"] }
goliath-normalize = { path = "../goliath-normalize", version = "0.2.2" }
serde.workspace = true
serde_bytes = "0.11"
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
