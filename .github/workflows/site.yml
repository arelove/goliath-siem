name: Site

# Builds the documentation site from docs/ and README.md, and publishes it
# from main. A pull request builds it and publishes nothing: the build fails
# on a link to a file that is not there, and on a figure of the front page
# that README.md no longer states.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Each job states what more it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A publication that began is finished, so the site is never half of one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install markdown-it-py==4.0.0
      - run: python scripts/site.py _site
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  publish:
    name: publish
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
