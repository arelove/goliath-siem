name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        # `--all-features` includes the benchmarks, which need a feature.
        run: cargo clippy --workspace --all-targets --all-features

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from the workspace manifest
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # `+toolchain` is required: rust-toolchain.toml would otherwise override
      # the installed MSRV toolchain with stable, and the check would pass on
      # code the declared MSRV cannot build.
      - run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --all-features

  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check links in Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline --include-fragments '**/*.md'
          fail: true

  prose:
    name: prose style policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject emoji
        run: |
          # CONTRIBUTING.md: no emoji anywhere that ships.
          if git grep -nIP '[\x{1F000}-\x{1FAFF}\x{2600}-\x{27BF}\x{FE0F}\x{2B00}-\x{2BFF}]' \
              -- ':!LICENSE'; then
            echo "::error::Emoji found. See CONTRIBUTING.md, Prose style."
            exit 1
          fi
      - name: Reject em and en dashes
        run: |
          # CONTRIBUTING.md: plain hyphens only.
          if git grep -nIP '[\x{2013}\x{2014}]' -- ':!LICENSE'; then
            echo "::error::Long dash found; use a plain hyphen. See CONTRIBUTING.md."
            exit 1
          fi
      - name: Crate licenses match the root
        run: |
          # A published package holds only its crate directory, so each crate
          # carries a copy of LICENSE; the copies must not drift.
          for copy in crates/*/LICENSE; do
            cmp -s LICENSE "$copy" || { echo "::error::$copy differs from LICENSE."; exit 1; }
          done
      - name: Reject non-English text outside localized files
        run: |
          # CONTRIBUTING.md: everything shipped is English except README_<lang>.md.
          # Cyrillic is the script we actually localize into, so it is what we
          # check for; extend this when another script is added.
          #
          # Language-switcher links carry the native language name by design,
          # so lines pointing at a localized README are exempt.
          found=$(git grep -nIP '[\x{0400}-\x{04FF}]' -- \
                    ':!README_*.md' ':!*.svg' ':!LICENSE' \
                  | grep -v 'README_[a-z][a-z]*\.md' || true)
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::Non-English text found outside localized files."
            exit 1
          fi
