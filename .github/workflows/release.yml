name: Release

# Releases are proposed, reviewed, then merged. Nothing publishes straight from
# a push. See docs/adr/0010-versioning-and-releases.md.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-pr:
    name: propose release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Open or update the release pull request
        uses: release-plz/action@51e32d708d306b2c2e98540245b276439f3137c3 # v0.5.139
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish:
    name: publish released crates
    runs-on: ubuntu-latest
    # Only runs once a release pull request has been merged: release-plz
    # detects that a version in the manifest is not yet on crates.io.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag, create the GitHub release, and publish to crates.io
        uses: release-plz/action@51e32d708d306b2c2e98540245b276439f3137c3 # v0.5.139
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
