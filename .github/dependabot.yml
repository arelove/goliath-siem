# Third-party actions are pinned by commit SHA, because the release workflow
# holds write access and the crates.io token. Dependabot keeps the pins current
# so that pinning does not quietly become running stale code.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
